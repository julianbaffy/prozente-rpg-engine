  <script type="module" src="app.js"></script>

<body>
  <header class="kopf">
    <h1>Powergaming mit Prozenten</h1>
    <p class="untertitel">Schadensrechner – wähle deine Ausrüstung und überprüfe deine Rechnung</p>
  </header>

  <main>
    <section class="einstellungen" aria-label="Einstellungen">
      <label>Gegenstände bis
        <select id="stufe">
          <option value="alle">alle Stufen</option>
        </select>
      </label>
      <div class="umschalter" role="group" aria-label="Würfelwurf" id="modus"></div>
      <div class="umschalter" role="group" aria-label="Rechenweg" id="rechenweg"></div>
    </section>

    <div class="werkbank">
      <section class="auswahl" id="auswahl" aria-label="Ausrüstung wählen"></section>
      <aside class="ausruestung" aria-labelledby="ausruestung-titel">
        <h2 id="ausruestung-titel">Deine Ausrüstung</h2>
        <div id="ausruestung-karten"></div>
      </aside>
    </div>

    <section class="ergebnis" aria-labelledby="ergebnis-titel">
      <h2 id="ergebnis-titel">Schaden pro Angriff</h2>
      <div id="ergebnis"></div>
    </section>

    <section class="verlauf" id="verlauf-bereich" aria-labelledby="verlauf-titel" hidden>
      <h2 id="verlauf-titel">Verlauf über mehrere Angriffe</h2>
      <div id="verlauf"></div>
    </section>
  </main>

  <div class="karte-pop" id="karte-pop" aria-hidden="true"></div>
  <div class="leiste" id="leiste" role="status" aria-live="polite" aria-hidden="true"></div>

  <noscript><p class="hinweis">Für den Rechner muss JavaScript eingeschaltet sein.</p></noscript>
</body>
</html>
